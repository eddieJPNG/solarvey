[package]
name = "solarvey-escrow"
version = "0.1.0"
edition = "2021"
publish = false
description = "Escrow de pesquisas pagas — Solarvey (Stellar/Soroban)"

[lib]
# `lib` é necessário para testes e fuzzing; `cdylib` gera o .wasm
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = "28"

[dev-dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }
